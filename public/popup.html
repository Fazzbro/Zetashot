<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenShot UI Camera</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #090c15;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .logo {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #111728;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
    }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">📷</div>
    <div>OpenShot UI Camera</div>
  </div>

  <button class="btn btn-primary" id="openStudioBtn">
    🎨 Open Camera Studio
  </button>

  <button class="btn" id="quickCaptureBtn">
    ⚡ Instant Viewport Capture
  </button>

  <div class="footer">
    100% Free • Open Source • Local-First
  </div>

  <script>
    document.getElementById('openStudioBtn').addEventListener('click', () => {
      if (typeof chrome !== 'undefined' && chrome.tabs) {
        chrome.tabs.create({ url: chrome.runtime.getURL('index.html') });
      } else {
        window.open('index.html', '_blank');
      }
    });

    document.getElementById('quickCaptureBtn').addEventListener('click', () => {
      if (typeof chrome !== 'undefined' && chrome.tabs) {
        chrome.tabs.captureVisibleTab({ format: 'png' }, (dataUrl) => {
          if (dataUrl) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `openshot-quick-capture-${Date.now()}.png`;
            a.click();
          }
        });
      }
    });
  </script>
</body>
</html>
