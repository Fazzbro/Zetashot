    <!-- Early inline defense against F12 and DevTools shortcuts before bundles load -->
    <script>
      (function() {
        document.addEventListener('contextmenu', function(e) {
          if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
          e.preventDefault();
        }, true);
        window.addEventListener('keydown', function(e) {
          var k = e.key;
          var c = e.ctrlKey || e.metaKey;
          if (k === 'F12' || (c && e.shiftKey && (k === 'I' || k === 'i' || k === 'J' || k === 'j' || k === 'C' || k === 'c')) || (c && (k === 'u' || k === 'U' || k === 's' || k === 'S'))) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
